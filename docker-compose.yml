name: torum

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: torum-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-torum}
      POSTGRES_USER: ${POSTGRES_USER:-torum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-postgres-password}
    ports:
      - "5432:5432"
    volumes:
      - torum_timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-torum} -d ${POSTGRES_DB:-torum}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: torum-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - torum_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    container_name: torum-api
    restart: unless-stopped
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Torum}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      TAILSCALE_ENABLED: ${TAILSCALE_ENABLED:-false}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://torum:change-postgres-password@timescaledb:5432/torum}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://100.124.49.118:4173,http://172.27.176.1:4173,http://172.18.64.1:4173,http://192.168.1.86:4173,https://pc-oficina.tail652fa7.ts.net}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-with-a-long-random-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      TORUM_SERVICE_TOKEN: ${TORUM_SERVICE_TOKEN:-}
      INTERNAL_AUTH_REQUIRED: ${INTERNAL_AUTH_REQUIRED:-true}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@torum.dev}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-change-admin-password}
      INITIAL_TRADER_USERNAME: ${INITIAL_TRADER_USERNAME:-trader}
      INITIAL_TRADER_EMAIL: ${INITIAL_TRADER_EMAIL:-trader@torum.dev}
      INITIAL_TRADER_PASSWORD: ${INITIAL_TRADER_PASSWORD:-change-trader-password}
      TRADING_MODE: ${TRADING_MODE:-PAPER}
      MT5_BRIDGE_BASE_URL: ${MT5_BRIDGE_BASE_URL:-http://host.docker.internal:9100}
      PRICE_STALE_AFTER_SECONDS: ${PRICE_STALE_AFTER_SECONDS:-30}
      CANDLE_PRICE_SOURCE: ${CANDLE_PRICE_SOURCE:-BID}
      CHART_BROKER_TIME_ZONE: ${CHART_BROKER_TIME_ZONE:-Etc/GMT-3}
      MOCK_MARKET_TICK_INTERVAL_SECONDS: ${MOCK_MARKET_TICK_INTERVAL_SECONDS:-1.0}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      DEFAULT_MAGIC_NUMBER: ${DEFAULT_MAGIC_NUMBER:-260426}
      DEFAULT_DEVIATION_POINTS: ${DEFAULT_DEVIATION_POINTS:-20}
      MT5_MISSING_POSITION_CONFIRMATIONS: ${MT5_MISSING_POSITION_CONFIRMATIONS:-3}
      MT5_ORDER_REQUEST_TIMEOUT_SECONDS: ${MT5_ORDER_REQUEST_TIMEOUT_SECONDS:-3}
      STRATEGY_RUN_ON_CANDLE_CLOSE_ONLY: ${STRATEGY_RUN_ON_CANDLE_CLOSE_ONLY:-true}
      RISK_RECOMPUTE_DEBOUNCE_SECONDS: ${RISK_RECOMPUTE_DEBOUNCE_SECONDS:-0.5}
      RISK_USE_MT5_PROFIT_CALIBRATION: ${RISK_USE_MT5_PROFIT_CALIBRATION:-true}
      RISK_MT5_CALIBRATION_TIMEOUT_SECONDS: ${RISK_MT5_CALIBRATION_TIMEOUT_SECONDS:-2.0}
      TRADE_JOB_POLL_INTERVAL_SECONDS: ${TRADE_JOB_POLL_INTERVAL_SECONDS:-0.5}
      TRADE_JOB_MAX_ATTEMPTS: ${TRADE_JOB_MAX_ATTEMPTS:-8}
      RUN_INTERNAL_SCHEDULERS: ${RUN_INTERNAL_SCHEDULERS:-true}
      ENFORCE_SINGLE_WORKER: ${ENFORCE_SINGLE_WORKER:-true}
      LOG_TO_FILES: ${LOG_TO_FILES:-true}
      LOG_DIRECTORY: ${LOG_DIRECTORY:-/app/logs}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10000000}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-20}
      STRATEGY_TRACE_ENABLED: ${STRATEGY_TRACE_ENABLED:-true}
      STRATEGY_TRACE_RECENT_CANDLES: ${STRATEGY_TRACE_RECENT_CANDLES:-30}
      TORUM_RESERVATION_TTL_SECONDS: ${TORUM_RESERVATION_TTL_SECONDS:-120}
      TORUM_AMBIGUOUS_RESERVATION_TTL_SECONDS: ${TORUM_AMBIGUOUS_RESERVATION_TTL_SECONDS:-86400}
      TORUM_RECONCILIATION_GRACE_SECONDS: ${TORUM_RECONCILIATION_GRACE_SECONDS:-20}
      TORUM_RECONCILIATION_ABSENT_SYNCS: ${TORUM_RECONCILIATION_ABSENT_SYNCS:-3}
      TORUM_MAX_ENTRY_DELAY_SECONDS: ${TORUM_MAX_ENTRY_DELAY_SECONDS:-60}
      STRATEGY_SYMBOL_LOCK_TIMEOUT_SECONDS: ${STRATEGY_SYMBOL_LOCK_TIMEOUT_SECONDS:-1}
      STRATEGY_PIPELINE_WARN_MS: ${STRATEGY_PIPELINE_WARN_MS:-1000}
      STRATEGY_PIPELINE_HARD_TIMEOUT_SECONDS: ${STRATEGY_PIPELINE_HARD_TIMEOUT_SECONDS:-4}
      NEWS_BLOCK_ENABLED: ${NEWS_BLOCK_ENABLED:-false}
      NEWS_BLOCK_MINUTES_BEFORE: ${NEWS_BLOCK_MINUTES_BEFORE:-60}
      NEWS_BLOCK_MINUTES_AFTER: ${NEWS_BLOCK_MINUTES_AFTER:-60}
      FMP_ECONOMIC_CALENDAR_URL: ${FMP_ECONOMIC_CALENDAR_URL:-https://financialmodelingprep.com/stable/economic-calendar}
      FMP_API_KEY: ${FMP_API_KEY:-}
      NEWS_BLS_ICS_URL: ${NEWS_BLS_ICS_URL:-https://www.bls.gov/schedule/news_release/bls.ics}
      NEWS_BEA_RELEASE_DATES_URL: ${NEWS_BEA_RELEASE_DATES_URL:-https://apps.bea.gov/API/signup/release_dates.json}
      NEWS_CENSUS_CALENDAR_URL: ${NEWS_CENSUS_CALENDAR_URL:-https://www.census.gov/economic-indicators/calendar-listview.html}
      NEWS_FED_CALENDAR_BASE_URL: ${NEWS_FED_CALENDAR_BASE_URL:-https://www.federalreserve.gov/newsevents}
      # Legacy only: old .env files can keep these values; TORUM no longer calls Finnhub.
      FINNHUB_CALENDAR_URL: ${FINNHUB_CALENDAR_URL:-https://finnhub.io/api/v1/calendar/economic}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      NEWS_PROVIDER_TIMEOUT_SECONDS: ${NEWS_PROVIDER_TIMEOUT_SECONDS:-10}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@torum.dev}
      WATCHDOG_BASE_URL: ${WATCHDOG_BASE_URL:-http://host.docker.internal:9200}
      WATCHDOG_ADMIN_TOKEN: ${WATCHDOG_ADMIN_TOKEN:-}
      WATCHDOG_TIMEOUT_SECONDS: ${WATCHDOG_TIMEOUT_SECONDS:-15}
    ports:
      - "${API_BIND_HOST:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  torum_timescaledb_data:
  torum_redis_data:
