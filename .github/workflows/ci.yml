name: Torum CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r services/api/requirements.txt
      - name: Compile Python
        run: python -m compileall -q services/api/app services/mt5_bridge/bridge
      - name: Run API tests
        env:
          PYTHONPATH: ${{ github.workspace }}/services/api
          DATABASE_URL: sqlite+pysqlite:///./ci.db
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: ci-secret
          INITIAL_ADMIN_USERNAME: admin
          INITIAL_ADMIN_EMAIL: admin@example.com
          INITIAL_ADMIN_PASSWORD: admin-password
          INITIAL_TRADER_USERNAME: trader
          INITIAL_TRADER_EMAIL: trader@example.com
          INITIAL_TRADER_PASSWORD: trader-password
          INTERNAL_AUTH_REQUIRED: "false"
          ENVIRONMENT: test
        run: pytest -q services/api/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
